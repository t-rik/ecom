<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#fae8ff" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad2)" rx="24" />

  <!-- Folding assembly illustration -->
  <g transform="translate(150, 180)" filter="url(#shadow2)">
    <rect x="0" y="0" width="500" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
    
    <!-- Step arrow -->
    <path d="M 250 80 L 250 200 M 230 180 L 250 205 L 270 180" fill="none" stroke="#9333ea" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="250" y="260" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1e293b" font-weight="bold">تركيب في أقل من دقيقتين</text>
    <text x="250" y="300" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#64748b">بدون أدوات، بدون مسامير، بدون تعب</text>
  </g>

  <!-- Tag -->
  <g transform="translate(100, 60)">
    <rect width="180" height="44" rx="22" fill="#9333ea" />
    <text x="90" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#ffffff" font-weight="bold">⚡ تركيب فوري وسريع</text>
  </g>
</svg>
