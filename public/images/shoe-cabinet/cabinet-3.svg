<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad3)" rx="24" />

  <g transform="translate(150, 180)" filter="url(#shadow3)">
    <rect x="0" y="0" width="500" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
    
    <!-- Shield Icon -->
    <path d="M 250 80 Q 300 80 320 130 Q 320 200 250 240 Q 180 200 180 130 Q 200 80 250 80 Z" fill="#0284c7" opacity="0.15" stroke="#0284c7" stroke-width="5" />
    <path d="M 225 155 L 245 175 L 280 135" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <text x="250" y="290" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#0f172a" font-weight="bold">مقاوم للأوزان الثقيلة والرطوبة</text>
    <text x="250" y="330" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#475569">بلاستيك بوليمر صلب يدوم لسنوات</text>
  </g>

  <!-- Tag -->
  <g transform="translate(100, 60)">
    <rect width="180" height="44" rx="22" fill="#0284c7" />
    <text x="90" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#ffffff" font-weight="bold">🛡️ جودة وضمان 100%</text>
  </g>
</svg>
